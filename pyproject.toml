[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnxpi-combadge"
version = "0.1.0"
description = "Pi-hosted control plane for OpenAI coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
combadge = "combadge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

